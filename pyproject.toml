[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosl-student"
version = "0.1.0"
description = "Public-input-only NOSL student engineering; no trained weights"
requires-python = ">=3.11"
dependencies = ["torch==2.6.0"]

[project.scripts]
nosl-student = "nosl.inference:main"
nosl-train = "nosl.train:main"

[tool.setuptools.packages.find]
where = ["python"]
