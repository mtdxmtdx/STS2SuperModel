<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STS2 全局决策标注器</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
  <header><div><p class="eyebrow">STS2 GLOBAL DECISION</p><h1>全局决策数据标注器</h1><p class="muted">输入种子后查看地图。左键高亮节点，右键在节点旁填写本节点发生的资源变化。</p></div><span id="health" class="pill">正在连接后端…</span></header>
  <section class="card" id="context-card"><h2>一、创建局面</h2><div class="grid two">
    <label>种子<input id="seed" placeholder="例如 ZWVCV8EKV8RG"></label>
    <label>角色<select id="character"><option>IRONCLAD</option><option>SILENT</option><option>DEFECT</option><option>NECROBINDER</option><option>REGENT</option></select></label>
    <label>进阶等级<input id="ascension" type="number" min="0" max="30" value="0"></label>
    <label>游戏版本<input id="game-version" value="v0.111.0"></label>
    <label>来源 ID<input id="source-id" placeholder="例如 run-20260831-001"><small class="hint">标识哪一局或哪一批数据。</small></label>
    <label>标注者 ID<input id="annotator-id" placeholder="例如 panyitong"><small class="hint">标识录入和核对数据的人。</small></label>
    <label class="wide">CLI 路径（可选）<input id="cli-path" placeholder="留空使用默认 CLI"></label>
  </div><div class="row"><button id="create">创建并显示地图</button></div><pre id="context-output" class="output"></pre></section>

  <section class="card hidden" id="workspace-card"><div class="section-head"><h2>二、地图</h2><div class="row compact"><button id="refresh-map" class="secondary">刷新地图</button><button id="checkpoint" class="secondary">保存检查点</button><button id="restore" class="secondary">恢复检查点</button><button id="validate" class="secondary">校验</button><button id="export" class="secondary">导出 JSONL</button></div></div>
    <div class="map-help"><span id="route-status" class="pill">尚未选择路线</span><span id="selected-node-label" class="muted">未高亮节点</span><span class="muted">左键：高亮　右键：打开节点填写窗</span></div>
    <div id="map-stage" class="map-stage"><div id="map" class="map"></div><div id="node-popup" class="node-popup hidden"></div></div>
    <pre id="validation-output" class="output"></pre>
    <div class="grid two"><div><h3>当前状态</h3><pre id="state" class="output tall">{}</pre></div><div><h3>当前已知资源</h3><div id="inventory" class="inventory"></div><h3>导入 .run（可选）</h3><input id="run-path" placeholder="D:\\…\\history\\xxxx.run"><button id="import-run" class="secondary">导入</button><pre id="run-summary" class="output tall"></pre></div></div>
  </section>
  <section class="card hidden" id="records-card"><h2>三、已记录节点</h2><div id="decisions" class="decision-list"></div><pre id="decision-output" class="output"></pre></section>
</main><script src="/static/app.js?v=map-structured-2"></script></body></html>
